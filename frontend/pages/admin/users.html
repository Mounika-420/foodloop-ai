<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['ADMIN']);</script>
</head>
<body>  <main id="content" class="fl-main" tabindex="-1">
    <h1 class="h3 mb-1">Users</h1>
    <p class="text-secondary">Search every account, and suspend or re-activate active users.</p>
    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-5"><label for="q" class="form-label small mb-1">Search name or email</label>
        <input id="q" type="search" class="form-control form-control-sm" placeholder="Search…" autocomplete="off"></div>
      <div class="col-6 col-md-2"><label for="role" class="form-label small mb-1">Role</label>
        <select id="role" class="form-select form-select-sm"><option value="">All</option><option>ADMIN</option><option>DONOR</option><option>NGO</option><option>VOLUNTEER</option></select></div>
      <div class="col-6 col-md-2"><label for="status" class="form-label small mb-1">Status</label>
        <select id="status" class="form-select form-select-sm"><option value="">All</option><option>PENDING</option><option>ACTIVE</option><option>SUSPENDED</option><option>REJECTED</option></select></div>
      <div class="col-md-3 d-flex align-items-center justify-content-md-end gap-2">
        <span id="count" class="small text-secondary" role="status"></span>
      </div>
    </div>

    <div class="fl-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th class="d-none d-lg-table-cell">Last login</th><th class="d-none d-lg-table-cell">Created</th><th class="text-end">Action</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6"><span class="fl-skeleton" style="height:2rem"></span></td></tr></tbody>
        </table>
      </div>
    </div>
    <div id="pager" class="d-flex justify-content-between align-items-center mt-3" hidden>
      <button id="prev" type="button" class="btn btn-outline-secondary btn-sm">&lsaquo; Prev</button>
      <span id="pageinfo" class="small text-secondary"></span>
      <button id="next" type="button" class="btn btn-outline-secondary btn-sm">Next &rsaquo;</button>
    </div>
  </main>

  <div class="modal fade" id="suspend-modal" tabindex="-1" aria-labelledby="suspend-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="suspend-title">Suspend user</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="suspend-what" class="mb-2"></p>
        <label for="suspend-reason" class="form-label">Reason <span class="text-secondary">(optional, max 255)</span></label>
        <textarea id="suspend-reason" class="form-control" rows="3" maxlength="255"></textarea></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="suspend-go" type="button" class="btn btn-danger">Suspend</button></div>
    </div></div>
  </div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      var me = FoodLoopAuth.getUser();
      if (!me) { return; }
      FoodLoopLayout.mount({ active: 'users' });
      var alertBox = document.getElementById('alert');
      var page = 0, totalPages = 1, total = 0, rows = [], target = null, timer = null;
      var modal = new bootstrap.Modal(document.getElementById('suspend-modal'));
      var SB = { ACTIVE: 'success', PENDING: 'warning', SUSPENDED: 'danger', REJECTED: 'secondary' };

      function row(u) {
        var action = '';
        if (u.id === me.id) { action = '<span class="small text-secondary">You</span>'; }
        else if (u.status === 'ACTIVE') { action = '<button type="button" class="btn btn-outline-danger btn-sm" data-act="suspend" data-id="' + u.id + '">Suspend</button>'; }
        else if (u.status === 'SUSPENDED') { action = '<button type="button" class="btn btn-outline-success btn-sm" data-act="activate" data-id="' + u.id + '">Activate</button>'; }
        else { action = '<span class="small text-secondary">See Verification</span>'; }
        return '<tr><td><div class="fw-semibold">' + esc(u.fullName) + '</div><div class="small text-secondary">' + esc(u.email) + '</div></td>' +
          '<td>' + esc(u.role) + '</td><td><span class="badge text-bg-' + (SB[u.status] || 'secondary') + '">' + esc(u.status) + '</span></td>' +
          '<td class="d-none d-lg-table-cell small">' + esc(u.lastLoginAt ? Ui.formatDateTime(u.lastLoginAt) : 'Never') + '</td>' +
          '<td class="d-none d-lg-table-cell small">' + esc(Ui.formatDateTime(u.createdAt)) + '</td>' +
          '<td class="text-end">' + action + '</td></tr>';
      }
      function render() {
        document.getElementById('count').textContent = total + ' user' + (total === 1 ? '' : 's');
        document.getElementById('rows').innerHTML = rows.length ? rows.map(row).join('') : '<tr><td colspan="6"><div class="fl-empty"><i class="bi bi-people" aria-hidden="true"></i>No users match.</div></td></tr>';
        document.getElementById('pager').hidden = totalPages <= 1;
        document.getElementById('pageinfo').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
        document.getElementById('prev').disabled = page <= 0;
        document.getElementById('next').disabled = page >= totalPages - 1;
      }
      function load() {
        Ui.clearAlert(alertBox);
        return Api.get('/api/admin/users', { query: { q: document.getElementById('q').value.trim(), role: document.getElementById('role').value, status: document.getElementById('status').value, page: page, size: 10 } })
          .then(function (r) { rows = (r && r.content) || []; totalPages = (r && r.totalPages) || 1; total = r && r.totalElements != null ? r.totalElements : rows.length; render(); })
          .catch(function (e) { document.getElementById('rows').innerHTML = ''; Ui.showAlert(alertBox, e.message); });
      }
      function find(id) { return rows.filter(function (u) { return String(u.id) === String(id); })[0]; }
      async function setStatus(id, status, reason, btn) {
        Ui.setBusy(btn, true, 'Saving…');
        try { await Api.patch('/api/admin/users/' + id + '/status', reason ? { status: status, reason: reason } : { status: status }); Ui.toast('User ' + status.toLowerCase() + '.'); modal.hide(); await load(); }
        catch (err) { Ui.toast(err.message, 'danger'); }
        finally { Ui.setBusy(btn, false); }
      }
      document.getElementById('rows').addEventListener('click', async function (e) {
        var b = e.target.closest('button[data-act]'); if (!b) { return; }
        var u = find(b.dataset.id); if (!u) { return; }
        if (b.dataset.act === 'suspend') {
          target = u; document.getElementById('suspend-what').textContent = 'Suspend ' + u.fullName + ' (' + u.email + ')? They will not be able to log in.';
          document.getElementById('suspend-reason').value = ''; modal.show();
        } else {
          var ok = await Ui.confirm({ title: 'Activate user?', message: 'Allow ' + u.fullName + ' to log in again.', confirmText: 'Activate' });
          if (ok) { setStatus(u.id, 'ACTIVE', '', b); }
        }
      });
      document.getElementById('suspend-go').addEventListener('click', function () {
        if (target) { setStatus(target.id, 'SUSPENDED', document.getElementById('suspend-reason').value.trim(), this); }
      });
      ['role', 'status'].forEach(function (id) { document.getElementById(id).addEventListener('change', function () { page = 0; load(); }); });
      document.getElementById('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { page = 0; load(); }, 300); });
      document.getElementById('prev').addEventListener('click', function () { if (page > 0) { page--; load(); } });
      document.getElementById('next').addEventListener('click', function () { if (page < totalPages - 1) { page++; load(); } });
      load();
    })();
  </script>
</body>
</html>
