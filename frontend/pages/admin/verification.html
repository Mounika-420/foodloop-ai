<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['ADMIN']);</script>
</head>
<body>  <main id="content" class="fl-main" tabindex="-1">
    <h1 class="h3 mb-1">Verification</h1>
    <p class="text-secondary">Donors and NGOs can take part only after you approve them.</p>
    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
      <div><label for="status" class="form-label small mb-1">Status</label>
        <select id="status" class="form-select form-select-sm"><option value="PENDING">Pending</option><option value="VERIFIED">Verified</option><option value="REJECTED">Rejected</option><option value="">All</option></select></div>
      <div><label for="type" class="form-label small mb-1">Type</label>
        <select id="type" class="form-select form-select-sm"><option value="">All</option><option value="DONOR">Donors</option><option value="NGO">NGOs</option></select></div>
      <span id="count" class="small text-secondary ms-auto" role="status"></span>
    </div>
    <div id="list" class="d-grid gap-3"><div class="fl-card p-4"><span class="fl-skeleton" style="height:3rem"></span></div></div>
  </main>

  <div class="modal fade" id="reject-modal" tabindex="-1" aria-labelledby="reject-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="reject-title">Reject registration</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="reject-what" class="mb-2"></p>
        <label for="reject-reason" class="form-label">Reason <span class="text-secondary">(optional, max 255)</span></label>
        <textarea id="reject-reason" class="form-control" rows="3" maxlength="255"></textarea></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="reject-go" type="button" class="btn btn-danger">Reject</button></div>
    </div></div>
  </div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'verification' });
      var alertBox = document.getElementById('alert'), listEl = document.getElementById('list');
      var items = [], target = null;
      var modal = new bootstrap.Modal(document.getElementById('reject-modal'));
      var SB = { PENDING: 'warning', VERIFIED: 'success', REJECTED: 'secondary' };

      function card(v) {
        var pending = v.status === 'PENDING';
        return '<div class="fl-card p-3" data-type="' + esc(v.type) + '" data-user="' + esc(v.userId) + '">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">' +
            '<div><div class="fw-semibold">' + esc(v.organizationName || v.fullName) + ' <span class="badge text-bg-light border ms-1">' + esc(v.type) + '</span></div>' +
            '<div class="small text-secondary">' + esc(v.fullName) + ' · ' + esc(v.email) + (v.registrationNumber ? ' · Reg. ' + esc(v.registrationNumber) : '') + '</div>' +
            '<div class="small text-secondary">Registered ' + esc(Ui.formatDateTime(v.createdAt)) + '</div></div>' +
            '<span class="badge text-bg-' + (SB[v.status] || 'secondary') + '">' + esc(v.status) + '</span></div>' +
          (pending || v.status === 'REJECTED' ? '<div class="d-flex gap-2 mt-3"><button type="button" class="btn btn-primary btn-sm" data-act="approve"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Approve</button>' +
            (pending ? '<button type="button" class="btn btn-outline-danger btn-sm" data-act="reject"><i class="bi bi-x-lg me-1" aria-hidden="true"></i>Reject</button>' : '') + '</div>' : '') +
          '</div>';
      }
      function render() {
        document.getElementById('count').textContent = items.length + ' registration' + (items.length === 1 ? '' : 's');
        listEl.innerHTML = items.length ? items.map(card).join('') : '<div class="fl-card"><div class="fl-empty"><i class="bi bi-patch-check" aria-hidden="true"></i>Nothing here. New donor and NGO registrations appear as Pending.</div></div>';
      }
      function load() {
        Ui.clearAlert(alertBox);
        return Api.get('/api/admin/verifications', { query: { status: document.getElementById('status').value, type: document.getElementById('type').value } })
          .then(function (r) { items = Array.isArray(r) ? r : ((r && r.content) || []); items.sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); }); render(); })
          .catch(function (e) { listEl.innerHTML = ''; Ui.showAlert(alertBox, e.message); });
      }
      function find(type, id) { return items.filter(function (v) { return v.type === type && String(v.userId) === String(id); })[0]; }
      listEl.addEventListener('click', async function (e) {
        var b = e.target.closest('button[data-act]'); if (!b) { return; }
        var box = b.closest('[data-user]'), v = find(box.dataset.type, box.dataset.user); if (!v) { return; }
        var name = v.organizationName || v.fullName;
        if (b.dataset.act === 'approve') {
          var ok = await Ui.confirm({ title: 'Approve ' + name + '?', message: 'They will be able to log in and take part.', confirmText: 'Approve' });
          if (!ok) { return; }
          Ui.setBusy(b, true, 'Approving…');
          try { await Api.post('/api/admin/verifications/' + encodeURIComponent(v.type) + '/' + v.userId + '/approve', {}); Ui.toast(name + ' approved.'); await load(); }
          catch (err) { Ui.setBusy(b, false); Ui.toast(err.message, 'danger'); }
        } else {
          target = v; document.getElementById('reject-what').textContent = 'Reject ' + name + '?'; document.getElementById('reject-reason').value = ''; modal.show();
        }
      });
      document.getElementById('reject-go').addEventListener('click', async function () {
        var btn = this, reason = document.getElementById('reject-reason').value.trim();
        Ui.setBusy(btn, true, 'Rejecting…');
        try { await Api.post('/api/admin/verifications/' + encodeURIComponent(target.type) + '/' + target.userId + '/reject', reason ? { reason: reason } : {}); modal.hide(); Ui.toast('Registration rejected.'); await load(); }
        catch (err) { Ui.toast(err.message, 'danger'); }
        finally { Ui.setBusy(btn, false); }
      });
      ['status', 'type'].forEach(function (id) { document.getElementById(id).addEventListener('change', load); });
      load();
    })();
  </script>
</body>
</html>
