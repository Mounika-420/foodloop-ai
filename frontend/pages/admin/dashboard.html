<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['ADMIN']);</script>
  <style>
    .fl-bar-track { background: var(--bs-secondary-bg); border-radius: 4px; height: 10px; overflow: hidden; }
    .fl-bar-fill { background: var(--fl-primary); height: 100%; border-radius: 4px; }
    .fl-stat a { text-decoration: none; }
  </style>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Welcome, <span id="who"></span></h1>
        <p class="text-secondary mb-0">Platform activity at a glance.</p>
      </div>
      <button id="refresh" type="button" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Refresh</button>
    </div>

    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Donations</div><div class="fl-stat-value" id="s-total">–</div><div class="small text-secondary" id="s-week"></div></div></div>
      <div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Food rescued</div><div class="fl-stat-value" id="s-rescued">–</div><div class="small text-secondary" id="s-posted"></div></div></div>
      <div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Deliveries confirmed</div><div class="fl-stat-value" id="s-conf">–</div><div class="small text-secondary" id="s-deliv"></div></div></div>
      <div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Pending verification</div><div class="fl-stat-value" id="s-pend">–</div><div class="small"><a href="verification.html">Review registrations</a></div></div></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-lg-6"><div class="fl-card p-3 h-100">
        <h2 class="h6 mb-3">Donations by category</h2>
        <div id="cats" class="d-grid gap-2"><span class="fl-skeleton" style="height:5rem"></span></div>
      </div></div>
      <div class="col-lg-6"><div class="fl-card p-3 h-100">
        <h2 class="h6 mb-3">Donations by status</h2>
        <div id="status" class="d-flex flex-wrap gap-2"><span class="fl-skeleton" style="height:2rem;width:60%"></span></div>
        <h2 class="h6 mt-4 mb-2">Volunteers</h2>
        <div id="vols" class="d-flex flex-wrap gap-2"></div>
      </div></div>
    </div>

    <div class="row g-3">
      <div class="col-md-6 col-xl-4"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Backend API</div><div class="fl-stat-value" id="api-status"><span class="fl-skeleton" style="width:6rem;height:1.75rem"></span></div></div></div>
      <div class="col-md-6 col-xl-8"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">AI service</div><div class="fl-stat-value" id="ai-status"><span class="fl-skeleton" style="width:6rem;height:1.75rem"></span></div><div class="small text-secondary mt-1" id="ai-detail"></div></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      var user = FoodLoopAuth.getUser();
      if (!user) { return; }
      FoodLoopLayout.mount({ active: 'dashboard' });
      document.getElementById('who').textContent = user.fullName;
      var alertBox = document.getElementById('alert');
      function $(id) { return document.getElementById(id); }
      function n(v) { return Number(v || 0).toLocaleString('en-IN'); }
      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }
      function chips(map, el, tone) {
        var keys = Object.keys(map || {});
        el.innerHTML = keys.length ? keys.map(function (k) {
          return '<span class="badge text-bg-' + tone + '">' + esc(label(k)) + ' · ' + n(map[k]) + '</span>';
        }).join('') : '<span class="small text-secondary">No data yet.</span>';
      }

      function loadStats() {
        Ui.clearAlert(alertBox);
        Api.get('/api/admin/stats').then(function (s) {
          var d = s.donations || {}, v = s.deliveries || {};
          $('s-total').textContent = n(d.total);
          $('s-week').textContent = n(d.last7Days) + ' in the last 7 days';
          $('s-rescued').textContent = Ui.formatKg(d.rescuedKg);
          $('s-posted').textContent = Ui.formatKg(d.totalKg) + ' posted in total';
          $('s-conf').textContent = n(v.confirmed);
          $('s-deliv').textContent = n(v.inProgress) + ' in progress · ' + n(v.failed) + ' failed · ' + Ui.formatKg(v.receivedKg) + ' received';
          var cats = (s.byCategory || []).slice().sort(function (a, b) { return Number(b.kg) - Number(a.kg); });
          var max = cats.reduce(function (m, c) { return Math.max(m, Number(c.kg) || 0); }, 0) || 1;
          $('cats').innerHTML = cats.length ? cats.map(function (c) {
            var pct = Math.max(2, (Number(c.kg) / max) * 100);
            return '<div><div class="d-flex justify-content-between small"><span>' + esc(c.category) + '</span><span class="text-secondary">' + n(c.donations) + ' · ' + esc(Ui.formatKg(c.kg)) + '</span></div>' +
              '<div class="fl-bar-track" role="img" aria-label="' + esc(c.category) + ': ' + esc(Ui.formatKg(c.kg)) + '"><div class="fl-bar-fill" style="width:' + pct.toFixed(0) + '%"></div></div></div>';
          }).join('') : '<span class="small text-secondary">No donations yet.</span>';
          chips(d.byStatus, $('status'), 'secondary');
          var vo = s.volunteers || {};
          var m = {}; m['Total'] = vo.total; Object.keys(vo.byAvailability || {}).forEach(function (k) { m[k] = vo.byAvailability[k]; });
          chips(m, $('vols'), 'success');
        }).catch(function (e) { Ui.showAlert(alertBox, e.message); });

        Api.get('/api/admin/verifications', { query: { status: 'PENDING' } }).then(function (r) {
          var list = Array.isArray(r) ? r : ((r && r.content) || []);
          $('s-pend').textContent = n(list.length);
        }).catch(function () { $('s-pend').textContent = '–'; });

        Api.get('/actuator/health', { auth: false })
          .then(function (h) { $('api-status').textContent = h && h.status === 'UP' ? 'Connected' : 'Problem'; })
          .catch(function () { $('api-status').textContent = 'Unreachable'; });

        Api.get('/api/ai/status').then(function (s) {
          $('ai-status').textContent = s.reachable ? 'Online' : 'Offline (rule-based fallback)';
          $('ai-detail').textContent = s.reachable
            ? (s.models || []).map(function (m) { return m.name + ': ' + m.algorithm + ' (MAE ' + m.mae + ')'; }).join(' · ')
            : (s.message || '');
        }).catch(function (e) { $('ai-status').textContent = 'Unknown'; $('ai-detail').textContent = e.message; });
      }
      $('refresh').addEventListener('click', loadStats);
      loadStats();
    })();
  </script>
</body>
</html>
