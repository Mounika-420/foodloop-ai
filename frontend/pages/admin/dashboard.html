<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['ADMIN']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <h1 class="h3 mb-1">Welcome, <span id="who"></span></h1>
    <p class="text-secondary">Your Admin dashboard is being built. Pages appear here step by step.</p>

    <div class="row g-3">
      <div class="col-md-6 col-xl-4">
        <div class="fl-card fl-stat">
          <div class="text-secondary small mb-1">Backend API</div>
          <div class="fl-stat-value" id="api-status"><span class="fl-skeleton" style="width:6rem;height:1.75rem"></span></div>
        </div>
      </div>
      <div class="col-md-6 col-xl-4" id="ai-card" hidden>
        <div class="fl-card fl-stat">
          <div class="text-secondary small mb-1">AI service</div>
          <div class="fl-stat-value" id="ai-status"><span class="fl-skeleton" style="width:6rem;height:1.75rem"></span></div>
          <div class="small text-secondary mt-1" id="ai-detail"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var user = FoodLoopAuth.getUser();
      if (!user) { return; }
      FoodLoopLayout.mount({ active: 'dashboard' });
      document.getElementById('who').textContent = user.fullName;

      var api = document.getElementById('api-status');
      FoodLoopApi.get('/actuator/health', { auth: false })
        .then(function (h) { api.textContent = h && h.status === 'UP' ? 'Connected' : 'Problem'; })
        .catch(function () { api.textContent = 'Unreachable'; });

      if (user.role === 'ADMIN') {
        document.getElementById('ai-card').hidden = false;
        var ai = document.getElementById('ai-status'), detail = document.getElementById('ai-detail');
        FoodLoopApi.get('/api/ai/status').then(function (s) {
          ai.textContent = s.reachable ? 'Online' : 'Offline (rule-based fallback)';
          detail.textContent = s.reachable
            ? (s.models || []).map(function (m) { return m.name + ': ' + m.algorithm + ' (MAE ' + m.mae + ')'; }).join(' · ')
            : (s.message || '');
        }).catch(function (e) { ai.textContent = 'Unknown'; detail.textContent = e.message; });
      }
    })();
  </script>
</body>
</html>
