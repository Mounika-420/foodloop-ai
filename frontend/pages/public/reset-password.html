<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
</head>
<body>
  <nav class="navbar border-bottom bg-body" aria-label="Main">
    <div class="container">
      <a class="navbar-brand fl-brand" href="../../index.html"><i class="bi bi-recycle me-1" aria-hidden="true"></i>FoodLoop AI</a>
      <button class="btn btn-outline-secondary btn-sm" type="button" data-theme-toggle></button>
    </div>
  </nav>

  <main class="fl-auth-wrap">
    <div class="fl-card fl-auth-card">
      <h1 class="h3 mb-1">Choose a new password</h1>
      <p class="text-secondary mb-4">Use the link from your email, or paste the token below.</p>

      <div id="form-alert" class="alert alert-danger" role="alert" aria-live="assertive" hidden></div>

      <form id="reset-form" novalidate>
        <div class="mb-3" id="token-row">
          <label for="token" class="form-label">Reset token</label>
          <input id="token" name="token" class="form-control" maxlength="128" autocomplete="off" required>
          <div class="invalid-feedback">Paste the token from your reset email.</div>
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">New password</label>
          <div class="input-group has-validation">
            <input id="newPassword" name="newPassword" type="password" class="form-control" autocomplete="new-password" aria-describedby="pw-rules" required>
            <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
            <div class="invalid-feedback">Password does not meet all the rules below.</div>
          </div>
          <ul id="pw-rules" class="list-unstyled small mt-2 mb-0" aria-live="polite"></ul>
        </div>
        <div class="mb-3">
          <label for="confirm" class="form-label">Confirm new password</label>
          <input id="confirm" name="confirm" type="password" class="form-control" autocomplete="new-password" required>
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>
        <button id="submit" type="submit" class="btn btn-primary w-100">Change password</button>
      </form>

      <p class="text-center small mt-4 mb-0"><a href="login.html">Back to log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/validators.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, V = FoodLoopValidators;
      var form = document.getElementById('reset-form');
      var alertBox = document.getElementById('form-alert');
      var submit = document.getElementById('submit');
      var pw = form.elements.newPassword, rules = document.getElementById('pw-rules');

      var token = new URLSearchParams(location.search).get('token');
      if (token) { form.elements.token.value = token; document.getElementById('token-row').hidden = true; }

      pw.addEventListener('input', function () { V.renderPasswordChecklist(rules, pw.value); });
      V.renderPasswordChecklist(rules, '');

      document.getElementById('toggle-password').addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        this.innerHTML = '<i class="bi ' + (show ? 'bi-eye-slash' : 'bi-eye') + '" aria-hidden="true"></i>';
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        Ui.clearAlert(alertBox);
        var t = form.elements.token, c = form.elements.confirm;
        t.classList.toggle('is-invalid', !t.value.trim());
        pw.classList.toggle('is-invalid', !V.isStrongPassword(pw.value));
        c.classList.toggle('is-invalid', c.value !== pw.value || !c.value);
        var bad = form.querySelector('.is-invalid');
        if (bad) { bad.focus(); return; }
        Ui.setBusy(submit, true, 'Saving…');
        try {
          await FoodLoopApi.post('/api/auth/reset-password', { token: t.value.trim(), newPassword: pw.value }, { auth: false });
          location.href = 'login.html?reset=1';
        } catch (err) {
          Ui.setBusy(submit, false);
          Ui.showAlert(alertBox, err.message || 'Could not reset the password.');
          document.getElementById('token-row').hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
