<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
</head>
<body>
  <nav class="navbar border-bottom bg-body" aria-label="Main">
    <div class="container">
      <a class="navbar-brand fl-brand" href="../../index.html"><i class="bi bi-recycle me-1" aria-hidden="true"></i>FoodLoop AI</a>
      <button class="btn btn-outline-secondary btn-sm" type="button" data-theme-toggle></button>
    </div>
  </nav>

  <main class="fl-auth-wrap">
    <div class="fl-card fl-auth-card">
      <h1 class="h3 mb-1">Forgot your password?</h1>
      <p class="text-secondary mb-4">Enter your email and we will send a reset link if the account exists.</p>

      <div id="result" class="alert alert-success" role="status" hidden></div>
      <div id="form-alert" class="alert alert-danger" role="alert" aria-live="assertive" hidden></div>

      <form id="forgot-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" autocomplete="email" required autofocus>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <button id="submit" type="submit" class="btn btn-primary w-100">Send reset link</button>
      </form>

      <p class="small text-secondary mt-3 mb-0">Running locally with email switched off? The reset link is written to the backend log instead.</p>
      <p class="text-center small mt-3 mb-0"><a href="login.html">Back to log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/validators.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi;
      var form = document.getElementById('forgot-form');
      var alertBox = document.getElementById('form-alert');
      var result = document.getElementById('result');
      var submit = document.getElementById('submit');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        Ui.clearAlert(alertBox);
        var email = form.elements.email;
        var ok = FoodLoopValidators.isEmail(email.value.trim());
        email.classList.toggle('is-invalid', !ok);
        if (!ok) { email.focus(); return; }
        Ui.setBusy(submit, true, 'Sending…');
        try {
          var res = await FoodLoopApi.post('/api/auth/forgot-password', { email: email.value.trim() }, { auth: false });
          result.textContent = (res && res.message) || 'If this email is registered, a password reset link has been sent.';
          result.hidden = false;
          form.hidden = true;
        } catch (err) {
          Ui.setBusy(submit, false);
          Ui.showAlert(alertBox, err.message);
        }
      });
    })();
  </script>
</body>
</html>
