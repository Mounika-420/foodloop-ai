<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Available donations · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['NGO']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Available donations</h1>
        <p class="text-secondary mb-0">Everything currently on offer across the platform. Offers ranked for you are under Recommended.</p>
      </div>
      <a class="btn btn-primary btn-sm" href="recommended.html"><i class="bi bi-stars me-1" aria-hidden="true"></i>Recommended for you</a>
    </div>

    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-5"><label for="q" class="form-label small mb-1">Search food</label>
        <input id="q" type="search" class="form-control form-control-sm" placeholder="e.g. biryani" autocomplete="off"></div>
      <div class="col-md-3"><label for="category" class="form-label small mb-1">Category</label>
        <select id="category" class="form-select form-select-sm">
          <option value="">All</option><option>Cooked Meals</option><option>Bakery</option><option>Fruits &amp; Vegetables</option>
          <option>Dairy</option><option>Packaged Food</option><option>Beverages</option><option>Grains &amp; Staples</option><option>Sweets</option>
        </select></div>
      <div class="col-md-4 text-md-end"><span id="count" class="small text-secondary" role="status"></span></div>
    </div>

    <div id="list" class="d-grid gap-3"><div class="fl-card p-4"><span class="fl-skeleton" style="height:4rem"></span></div></div>

    <div id="pager" class="d-flex justify-content-between align-items-center mt-3" hidden>
      <button id="prev" type="button" class="btn btn-outline-secondary btn-sm">&lsaquo; Prev</button>
      <span id="pageinfo" class="small text-secondary"></span>
      <button id="next" type="button" class="btn btn-outline-secondary btn-sm">Next &rsaquo;</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'available-donations' });
      var $ = function (id) { return document.getElementById(id); };
      var page = 0, totalPages = 1, total = 0, rows = [], timer = null;
      var STORAGE = { ROOM_TEMP: 'Room temperature', REFRIGERATED: 'Refrigerated', FROZEN: 'Frozen', HOT_HELD: 'Kept hot' };

      function card(d) {
        var cat = d.category ? (d.category.name || d.category) : '';
        var loc = d.pickupLocation ? [d.pickupLocation.area, d.pickupLocation.city].filter(Boolean).join(', ') : '';
        return '<div class="fl-card p-3">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">' +
            '<div><div class="fw-semibold fs-5">' + esc(d.foodName) + '</div>' +
            '<div class="small text-secondary">' + esc(cat) + ' · ' + esc(d.quantity) + ' ' + esc(String(d.unit || '').toLowerCase()) + ' · ' + esc(STORAGE[d.storageCondition] || d.storageCondition || '') +
            (d.vegetarian ? ' · <span class="text-success">Veg</span>' : ' · Non-veg') + '</div></div>' +
            '<span class="badge text-bg-primary">' + esc(String(d.status || '').toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); })) + '</span>' +
          '</div>' +
          '<dl class="row small mt-3 mb-0">' +
            '<dt class="col-sm-3 text-secondary fw-normal">Pickup window</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(d.pickupWindowStart)) + ' – ' + esc(Ui.formatDateTime(d.pickupWindowEnd)) + '</dd>' +
            '<dt class="col-sm-3 text-secondary fw-normal">Best before</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(d.expiresAt)) + '</dd>' +
            (loc ? '<dt class="col-sm-3 text-secondary fw-normal">Pickup area</dt><dd class="col-sm-9">' + esc(loc) + '</dd>' : '') +
            (d.description ? '<dt class="col-sm-3 text-secondary fw-normal">Notes</dt><dd class="col-sm-9">' + esc(d.description) + '</dd>' : '') +
          '</dl></div>';
      }
      function render() {
        $('count').textContent = total + ' donation' + (total === 1 ? '' : 's');
        $('list').innerHTML = rows.length ? rows.map(card).join('') :
          '<div class="fl-card"><div class="fl-empty"><i class="bi bi-basket" aria-hidden="true"></i>Nothing available right now. Check back soon.</div></div>';
        $('pager').hidden = totalPages <= 1;
        $('pageinfo').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
        $('prev').disabled = page <= 0;
        $('next').disabled = page >= totalPages - 1;
      }
      function load() {
        Ui.clearAlert($('alert'));
        return Api.get('/api/donations/available', { query: { q: $('q').value.trim(), category: $('category').value, page: page, size: 10 } }).then(function (r) {
          rows = (r && r.content) || []; totalPages = (r && r.totalPages) || 1; total = r && r.totalElements != null ? r.totalElements : rows.length; render();
        }).catch(function (e) { $('list').innerHTML = ''; Ui.showAlert($('alert'), e.message); });
      }
      $('category').addEventListener('change', function () { page = 0; load(); });
      $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { page = 0; load(); }, 300); });
      $('prev').addEventListener('click', function () { if (page > 0) { page--; load(); window.scrollTo({ top: 0 }); } });
      $('next').addEventListener('click', function () { if (page < totalPages - 1) { page++; load(); window.scrollTo({ top: 0 }); } });
      load();
    })();
  </script>
</body>
</html>
