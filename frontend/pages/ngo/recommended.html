<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommended donations · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['NGO']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Recommended for you</h1>
        <p class="text-secondary mb-0">Donations ranked for your organisation by distance, category, expiry, capacity and quantity.</p>
      </div>
      <div id="pager" class="d-flex align-items-center gap-2" hidden>
        <button id="prev" type="button" class="btn btn-outline-secondary btn-sm">&lsaquo; Prev</button>
        <span id="pageinfo" class="small text-secondary"></span>
        <button id="next" type="button" class="btn btn-outline-secondary btn-sm">Next &rsaquo;</button>
      </div>
    </div>

    <div id="alert" class="alert alert-danger" role="alert" hidden></div>
    <div id="count" class="small text-secondary mb-2" role="status"></div>
    <div id="list" class="d-grid gap-3"><div class="fl-card p-4"><span class="fl-skeleton" style="height:4rem"></span></div></div>
  </main>

  <div class="modal fade" id="reject-modal" tabindex="-1" aria-labelledby="reject-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="reject-title">Reject this offer</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <p id="reject-what" class="mb-2"></p>
        <label for="reject-reason" class="form-label">Reason <span class="text-secondary">(optional, max 200 characters)</span></label>
        <textarea id="reject-reason" class="form-control" rows="3" maxlength="200" placeholder="e.g. Not enough capacity today"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Keep offer</button>
        <button id="reject-go" type="button" class="btn btn-danger">Reject</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'recommended' });

      var listEl = document.getElementById('list');
      var alertBox = document.getElementById('alert');
      var offers = [], page = 0, totalPages = 1, total = 0, rejectId = null;
      var MAX = { distance: 30, category: 25, expiry: 15, capacity: 15, quantity: 15 };
      var STORAGE = { ROOM_TEMP: 'Room temperature', REFRIGERATED: 'Refrigerated', FROZEN: 'Frozen', HOT_HELD: 'Kept hot' };
      var BADGE = { NOTIFIED: 'primary', ACCEPTED: 'success', REJECTED: 'secondary', EXPIRED: 'secondary' };
      var modal = new bootstrap.Modal(document.getElementById('reject-modal'));

      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }
      function num(v, d) { return v == null ? '–' : Number(v).toFixed(d); }

      function breakdown(b) {
        if (!b) { return ''; }
        return Object.keys(MAX).filter(function (k) { return b[k] != null; }).map(function (k) {
          var pct = Math.max(0, Math.min(100, (Number(b[k]) / MAX[k]) * 100));
          return '<div class="mb-2"><div class="d-flex justify-content-between small"><span>' + esc(label(k)) + '</span><span class="text-secondary">' + num(b[k], 1) + ' / ' + MAX[k] + '</span></div>' +
            '<div class="progress" style="height:6px" role="progressbar" aria-label="' + esc(label(k)) + '" aria-valuenow="' + pct.toFixed(0) + '" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:' + pct.toFixed(0) + '%"></div></div></div>';
        }).join('');
      }

      function card(o) {
        var d = o.donation || {};
        var cat = d.category ? (d.category.name || d.category) : '';
        var open = o.status === 'NOTIFIED';
        var loc = d.pickupLocation ? [d.pickupLocation.area, d.pickupLocation.city].filter(Boolean).join(', ') : '';
        return '<div class="fl-card p-3" data-match="' + o.matchId + '">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">' +
            '<div><div class="fw-semibold fs-5">' + esc(d.foodName) + '</div>' +
            '<div class="small text-secondary">' + esc(cat) + ' · ' + esc(d.quantity) + ' ' + esc(String(d.unit || '').toLowerCase()) +
            ' · ' + esc(STORAGE[d.storageCondition] || d.storageCondition || '') + (d.vegetarian ? ' · <span class="text-success">Veg</span>' : ' · Non-veg') + '</div></div>' +
            '<div class="text-end"><span class="badge text-bg-' + (BADGE[o.status] || 'secondary') + '">' + esc(label(o.status)) + '</span>' +
            '<div class="small text-secondary mt-1">Rank #' + esc(o.rank) + ' · score ' + num(o.matchScore, 0) + ' · ' + num(o.distanceKm, 1) + ' km</div></div>' +
          '</div>' +
          '<dl class="row small mt-3 mb-2">' +
            '<dt class="col-sm-3 text-secondary fw-normal">Pickup window</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(d.pickupWindowStart)) + ' – ' + esc(Ui.formatDateTime(d.pickupWindowEnd)) + '</dd>' +
            '<dt class="col-sm-3 text-secondary fw-normal">Best before</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(d.expiresAt)) + '</dd>' +
            (loc ? '<dt class="col-sm-3 text-secondary fw-normal">Pickup area</dt><dd class="col-sm-9">' + esc(loc) + '</dd>' : '') +
            (d.description ? '<dt class="col-sm-3 text-secondary fw-normal">Notes</dt><dd class="col-sm-9">' + esc(d.description) + '</dd>' : '') +
          '</dl>' +
          '<details class="mb-2"><summary class="small text-secondary" style="cursor:pointer">Why this rank?</summary><div class="mt-2" style="max-width:420px">' + breakdown(o.breakdown) + '</div></details>' +
          (open ? '<div class="d-flex gap-2 mt-2"><button type="button" class="btn btn-primary btn-sm" data-act="accept"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Accept</button>' +
            '<button type="button" class="btn btn-outline-danger btn-sm" data-act="reject"><i class="bi bi-x-lg me-1" aria-hidden="true"></i>Reject</button></div>' : '') +
          '</div>';
      }

      function render() {
        document.getElementById('count').textContent = total + ' offer' + (total === 1 ? '' : 's');
        document.getElementById('pager').hidden = totalPages <= 1;
        document.getElementById('pageinfo').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
        document.getElementById('prev').disabled = page <= 0;
        document.getElementById('next').disabled = page >= totalPages - 1;
        listEl.innerHTML = offers.length ? offers.map(card).join('') :
          '<div class="fl-card"><div class="fl-empty"><i class="bi bi-stars" aria-hidden="true"></i>No offers right now. New donations that match your categories and opening hours appear here.</div></div>';
      }

      function load() {
        Ui.clearAlert(alertBox);
        return Api.get('/api/ngo/recommended', { query: { page: page, size: 10 } }).then(function (r) {
          offers = Array.isArray(r) ? r : ((r && r.content) || []);
          totalPages = (r && r.totalPages) || 1;
          total = (r && r.totalElements != null) ? r.totalElements : offers.length;
          if (page > 0 && !offers.length) { page = Math.max(0, totalPages - 1); return load(); }
          render();
        }).catch(function (e) { listEl.innerHTML = ''; Ui.showAlert(alertBox, e.message); });
      }

      function find(id) { return offers.filter(function (o) { return String(o.matchId) === String(id); })[0]; }

      listEl.addEventListener('click', async function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) { return; }
        var id = btn.closest('[data-match]').dataset.match;
        var o = find(id);
        var name = o && o.donation ? o.donation.foodName : 'this donation';
        if (btn.dataset.act === 'accept') {
          var ok = await Ui.confirm({ title: 'Accept this offer?', message: 'Accept ' + name + '. Other NGOs will no longer be offered it.', confirmText: 'Accept', cancelText: 'Not now' });
          if (!ok) { return; }
          Ui.setBusy(btn, true, 'Accepting…');
          try { await Api.post('/api/ngo/matches/' + id + '/accept', {}); var dd = (o && o.donation) || {}; location.href = FoodLoopConfig.pageUrl('pages/ngo/pickups.html') + '?schedule=' + encodeURIComponent(dd.id) + '&name=' + encodeURIComponent(dd.foodName || '') + '&start=' + encodeURIComponent(dd.pickupWindowStart || '') + '&end=' + encodeURIComponent(dd.pickupWindowEnd || ''); }
          catch (err) { Ui.setBusy(btn, false); Ui.toast(err.message, 'danger'); await load(); }
        } else {
          rejectId = id;
          document.getElementById('reject-what').textContent = 'Reject ' + name + '?';
          document.getElementById('reject-reason').value = '';
          modal.show();
        }
      });

      document.getElementById('reject-go').addEventListener('click', async function () {
        var btn = this, reason = document.getElementById('reject-reason').value.trim();
        Ui.setBusy(btn, true, 'Rejecting…');
        try {
          await Api.post('/api/ngo/matches/' + rejectId + '/reject', reason ? { reason: reason } : {});
          modal.hide(); Ui.toast('Offer rejected.'); await load();
        } catch (err) { Ui.toast(err.message, 'danger'); }
        finally { Ui.setBusy(btn, false); }
      });

      document.getElementById('prev').addEventListener('click', function () { if (page > 0) { page--; load(); window.scrollTo({ top: 0 }); } });
      document.getElementById('next').addEventListener('click', function () { if (page < totalPages - 1) { page++; load(); window.scrollTo({ top: 0 }); } });
      load();
    })();
  </script>
</body>
</html>
