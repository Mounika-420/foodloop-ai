<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickups · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['NGO']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <h1 class="h3 mb-1">Pickups</h1>
    <p class="text-secondary">Schedule collection of donations you accepted, follow the volunteer, and confirm what you received.</p>

    <div id="alert" class="alert alert-danger" role="alert" aria-live="assertive" hidden></div>

    <div class="fl-card p-3 mb-4" style="max-width: 640px">
      <h2 class="h6 mb-2">Schedule a pickup</h2>
      <p id="sched-note" class="small text-secondary mb-3">Choose the accepted donation and a time inside its pickup window.</p>
      <form id="sched" novalidate>
        <div class="row g-3 align-items-end">
          <div class="col-sm-4">
            <label for="donationId" class="form-label">Donation ID</label>
            <input id="donationId" name="donationId" type="number" min="1" class="form-control" required>
            <div class="invalid-feedback">Enter the donation ID.</div>
          </div>
          <div class="col-sm-5">
            <label for="scheduledPickupAt" class="form-label">Pickup time</label>
            <input id="scheduledPickupAt" name="scheduledPickupAt" type="datetime-local" class="form-control" required>
            <div class="invalid-feedback">Choose a pickup time.</div>
          </div>
          <div class="col-sm-3"><button id="sched-go" type="submit" class="btn btn-primary w-100">Schedule</button></div>
        </div>
      </form>
    </div>

    <h2 class="h6 text-uppercase text-secondary">Your pickups</h2>
    <div id="list" class="d-grid gap-3"><div class="fl-card p-4"><span class="fl-skeleton" style="height:3rem"></span></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'pickups' });

      var listEl = document.getElementById('list');
      var alertBox = document.getElementById('alert');
      var form = document.getElementById('sched');
      var params = new URLSearchParams(location.search);

      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function local(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }

      // prefill from the Accept redirect: ?schedule=ID&name=..&start=..&end=..
      if (params.get('schedule')) {
        form.elements.donationId.value = params.get('schedule');
        var s = params.get('start') ? new Date(params.get('start')) : null;
        var e = params.get('end') ? new Date(params.get('end')) : null;
        var t = new Date(Date.now() + 15 * 60000);
        if (s && !isNaN(s)) { if (t < s || (e && !isNaN(e) && t > e)) { t = s; } }
        form.elements.scheduledPickupAt.value = local(t);
        var note = 'Offer accepted' + (params.get('name') ? ' for ' + params.get('name') : '') + '. ';
        if (s && e && !isNaN(s) && !isNaN(e)) { note += 'Pick a time between ' + Ui.formatDateTime(s) + ' and ' + Ui.formatDateTime(e) + '.'; }
        document.getElementById('sched-note').textContent = note;
      }

      var PICK = { PENDING_ASSIGNMENT: 'secondary', ASSIGNED: 'info', VOLUNTEER_ACCEPTED: 'primary', PICKED_UP: 'warning', CANCELLED: 'secondary' };
      var DELIV = { NOT_STARTED: 'secondary', PICKED_UP: 'warning', IN_TRANSIT: 'warning', DELIVERED: 'success', RECEIPT_CONFIRMED: 'success', FAILED: 'danger' };

      function card(p) {
        var canConfirm = p.deliveryId && p.deliveryStatus === 'DELIVERED';
        var steps = [];
        steps.push(p.volunteerId ? 'Volunteer assigned' : 'Waiting for a volunteer');
        return '<div class="fl-card p-3" data-delivery="' + (p.deliveryId || '') + '">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">' +
            '<div><div class="fw-semibold">Donation #' + esc(p.donationId) + ' <span class="text-secondary fw-normal small">pickup #' + esc(p.id) + '</span></div>' +
            '<div class="small text-secondary">' + esc(p.category || '') + ' · ' + esc(p.quantityKg) + ' kg</div></div>' +
            '<div class="d-flex gap-1 flex-wrap justify-content-end">' +
              '<span class="badge text-bg-' + (PICK[p.status] || 'secondary') + '">' + esc(label(p.status)) + '</span>' +
              (p.deliveryStatus ? '<span class="badge text-bg-' + (DELIV[p.deliveryStatus] || 'secondary') + '">Delivery: ' + esc(label(p.deliveryStatus)) + '</span>' : '') +
            '</div></div>' +
          '<dl class="row small mt-3 mb-0">' +
            '<dt class="col-sm-3 text-secondary fw-normal">Scheduled</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(p.scheduledPickupAt)) + '</dd>' +
            '<dt class="col-sm-3 text-secondary fw-normal">Pickup window</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(p.pickupWindowStart)) + ' – ' + esc(Ui.formatDateTime(p.pickupWindowEnd)) + '</dd>' +
            '<dt class="col-sm-3 text-secondary fw-normal">Volunteer</dt><dd class="col-sm-9">' + esc(steps[0]) + '</dd>' +
          '</dl>' +
          (canConfirm ?
            '<form class="d-flex flex-wrap gap-2 align-items-end mt-3" data-confirm novalidate>' +
              '<div><label class="form-label small mb-1" for="q-' + p.deliveryId + '">Quantity received (kg)</label>' +
              '<input id="q-' + p.deliveryId + '" name="quantityReceivedKg" type="number" min="0.1" max="' + esc(p.quantityKg) + '" step="0.1" value="' + esc(p.quantityKg) + '" class="form-control form-control-sm" style="width:10rem" required></div>' +
              '<button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check2-circle me-1" aria-hidden="true"></i>Confirm receipt</button></form>' : '') +
          '</div>';
      }

      function load() {
        return Api.get('/api/ngo/pickups').then(function (r) {
          var rows = Array.isArray(r) ? r : ((r && r.content) || []);
          rows.sort(function (a, b) { return b.id - a.id; });
          listEl.innerHTML = rows.length ? rows.map(card).join('') :
            '<div class="fl-card"><div class="fl-empty"><i class="bi bi-truck" aria-hidden="true"></i>No pickups yet. Accept an offer, then schedule its pickup above.</div></div>';
        }).catch(function (err) { listEl.innerHTML = ''; Ui.showAlert(alertBox, err.message); });
      }

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        Ui.clearAlert(alertBox); Ui.clearFieldErrors(form);
        form.classList.add('was-validated');
        if (!form.checkValidity()) { form.querySelector(':invalid').focus(); return; }
        var btn = document.getElementById('sched-go');
        Ui.setBusy(btn, true, 'Scheduling…');
        try {
          await Api.post('/api/ngo/pickups', { donationId: Number(form.elements.donationId.value), scheduledPickupAt: form.elements.scheduledPickupAt.value + ':00' });
          Ui.toast('Pickup scheduled. A volunteer will be assigned.');
          form.reset(); form.classList.remove('was-validated');
          document.getElementById('sched-note').textContent = 'Choose the accepted donation and a time inside its pickup window.';
          try { history.replaceState(null, '', location.pathname); } catch (x) {}
          await load();
        } catch (err) {
          form.classList.remove('was-validated');
          var m = Ui.showFieldErrors(form, err.fieldErrors);
          Ui.showAlert(alertBox, m ? 'Please fix the highlighted fields.' : (err.message || 'Could not schedule the pickup.'));
        } finally { Ui.setBusy(btn, false); }
      });

      listEl.addEventListener('submit', async function (ev) {
        var f = ev.target.closest('form[data-confirm]');
        if (!f) { return; }
        ev.preventDefault();
        var id = f.closest('[data-delivery]').dataset.delivery;
        var q = Number(f.elements.quantityReceivedKg.value);
        if (!(q > 0)) { f.elements.quantityReceivedKg.focus(); return; }
        var btn = f.querySelector('button[type=submit]');
        Ui.setBusy(btn, true, 'Confirming…');
        try { await Api.post('/api/ngo/deliveries/' + id + '/confirm', { quantityReceivedKg: q }); Ui.toast('Receipt confirmed. Thank you!'); await load(); }
        catch (err) { Ui.setBusy(btn, false); Ui.toast(err.message, 'danger'); }
      });

      load();
    })();
  </script>
</body>
</html>
