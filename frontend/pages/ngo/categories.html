<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accepted categories · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['NGO']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <h1 class="h3 mb-1">Accepted food categories</h1>
    <p class="text-secondary">Choose the kinds of food your organisation can use. You will only receive offers for these. Leave everything unticked to accept all categories.</p>

    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="fl-card p-4" style="max-width: 640px">
      <form id="form" novalidate>
        <fieldset id="boxes" disabled>
          <legend class="visually-hidden">Food categories</legend>
          <div id="list" class="row g-2"><div class="col-12"><span class="fl-skeleton" style="height:8rem"></span></div></div>
        </fieldset>
        <div class="d-flex flex-wrap align-items-center gap-2 mt-4">
          <button id="save" type="submit" class="btn btn-primary" disabled>Save</button>
          <button id="clear" type="button" class="btn btn-outline-secondary" disabled>Accept all categories</button>
          <span id="state" class="small text-secondary ms-auto" role="status"></span>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'categories' });

      // ids match the food_categories table
      var CATS = [
        [1, 'Cooked Meals', 'bi-egg-fried'], [2, 'Bakery', 'bi-cake2'], [3, 'Fruits & Vegetables', 'bi-apple'],
        [4, 'Dairy', 'bi-cup-straw'], [5, 'Packaged Food', 'bi-box2'], [6, 'Beverages', 'bi-cup-hot'],
        [7, 'Grains & Staples', 'bi-basket'], [8, 'Sweets', 'bi-gift']
      ];
      var list = document.getElementById('list');
      var boxes = document.getElementById('boxes');
      var save = document.getElementById('save');
      var clear = document.getElementById('clear');
      var alertBox = document.getElementById('alert');
      var stateEl = document.getElementById('state');

      list.innerHTML = CATS.map(function (c) {
        return '<div class="col-sm-6"><div class="form-check">' +
          '<input class="form-check-input" type="checkbox" id="cat-' + c[0] + '" value="' + c[0] + '">' +
          '<label class="form-check-label" for="cat-' + c[0] + '"><i class="bi ' + c[2] + ' me-2" aria-hidden="true"></i>' + Ui.escapeHtml(c[1]) + '</label>' +
          '</div></div>';
      }).join('');

      function selected() {
        return Array.prototype.slice.call(list.querySelectorAll('input:checked')).map(function (i) { return Number(i.value); });
      }
      function apply(res) {
        var ids = (res && res.categoryIds) || [];
        CATS.forEach(function (c) { document.getElementById('cat-' + c[0]).checked = ids.indexOf(c[0]) !== -1; });
        stateEl.textContent = res && res.acceptsAll ? 'Currently accepting all categories.' : 'Currently accepting ' + ids.length + ' categor' + (ids.length === 1 ? 'y' : 'ies') + '.';
      }
      function busy(b) { boxes.disabled = b; save.disabled = b; clear.disabled = b; }

      busy(true);
      Api.get('/api/ngo/categories').then(function (r) { apply(r); busy(false); })
        .catch(function (e) { Ui.showAlert(alertBox, e.message); });

      async function put(ids, okMsg) {
        Ui.clearAlert(alertBox);
        busy(true);
        try {
          var r = await Api.put('/api/ngo/categories', { categoryIds: ids });
          apply(r);
          Ui.toast(okMsg);
        } catch (e) {
          Ui.showAlert(alertBox, e.message);
        } finally { busy(false); }
      }
      document.getElementById('form').addEventListener('submit', function (e) {
        e.preventDefault();
        put(selected(), selected().length ? 'Categories saved.' : 'Now accepting all categories.');
      });
      clear.addEventListener('click', function () { put([], 'Now accepting all categories.'); });
    })();
  </script>
</body>
</html>
