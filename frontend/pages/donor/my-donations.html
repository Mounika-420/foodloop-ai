<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My donations · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['DONOR']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">My donations</h1>
        <p class="text-secondary mb-0">Track every donation from posting to delivery.</p>
      </div>
      <a class="btn btn-primary" href="add-donation.html"><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Add donation</a>
    </div>

    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <label for="filter" class="form-label mb-0 small text-secondary">Status</label>
      <select id="filter" class="form-select form-select-sm" style="width:auto">
        <option value="">All</option>
        <option value="OPEN">Open (available / matched)</option>
        <option value="ACTIVE">In progress</option>
        <option value="DONE">Completed</option>
        <option value="CLOSED">Cancelled / expired</option>
      </select>
      <span id="count" class="small text-secondary ms-auto" role="status"></span>
    </div>

    <div id="list" class="d-grid gap-3"><div class="fl-card p-4"><span class="fl-skeleton" style="height:3rem"></span></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'my-donations' });

      var listEl = document.getElementById('list');
      var alertBox = document.getElementById('alert');
      var all = [];

      var GROUP = {
        AVAILABLE: 'OPEN', MATCHED: 'OPEN',
        ACCEPTED: 'ACTIVE', VOLUNTEER_ASSIGNED: 'ACTIVE', PICKED_UP: 'ACTIVE', IN_TRANSIT: 'ACTIVE', DELIVERED: 'ACTIVE',
        COMPLETED: 'DONE', CANCELLED: 'CLOSED', EXPIRED: 'CLOSED', REJECTED_ALL: 'CLOSED'
      };
      var BADGE = { OPEN: 'primary', ACTIVE: 'warning', DONE: 'success', CLOSED: 'secondary' };
      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }

      function card(d) {
        var g = GROUP[d.status] || 'CLOSED';
        var cancellable = d.status === 'AVAILABLE' || d.status === 'MATCHED';
        var cat = d.categoryName || (d.category && d.category.name) || '';
        var meta = [];
        if (cat) { meta.push(esc(cat)); }
        meta.push(esc(d.quantity) + ' ' + esc(String(d.unit || '').toLowerCase()));
        if (d.expiresAt) { meta.push('best before ' + esc(Ui.formatDateTime(d.expiresAt))); }
        if (d.pickupWindowStart) { meta.push('pickup ' + esc(Ui.formatDateTime(d.pickupWindowStart))); }
        return '<div class="fl-card p-3" data-id="' + d.id + '">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">' +
          '<div><div class="fw-semibold">' + esc(d.foodName) + ' <span class="text-secondary fw-normal small">#' + d.id + '</span></div>' +
          '<div class="small text-secondary">' + meta.join(' · ') + '</div></div>' +
          '<span class="badge text-bg-' + BADGE[g] + '">' + esc(label(d.status)) + '</span></div>' +
          '<div class="d-flex flex-wrap gap-2 mt-3">' +
          '<button type="button" class="btn btn-outline-primary btn-sm" data-act="matches"><i class="bi bi-diagram-3 me-1" aria-hidden="true"></i>View matches</button>' +
          (cancellable ? '<button type="button" class="btn btn-outline-danger btn-sm" data-act="cancel"><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Cancel</button>' : '') +
          '</div><div class="mt-3" data-box hidden></div></div>';
      }

      function render() {
        var f = document.getElementById('filter').value;
        var rows = all.filter(function (d) { return !f || GROUP[d.status] === f || (f === 'CLOSED' && !GROUP[d.status]); });
        document.getElementById('count').textContent = rows.length + ' of ' + all.length;
        if (!rows.length) {
          listEl.innerHTML = '<div class="fl-card"><div class="fl-empty"><i class="bi bi-box-seam" aria-hidden="true"></i>' +
            (all.length ? 'No donations with this status.' : 'No donations yet. Post your first one.') + '</div></div>';
          return;
        }
        listEl.innerHTML = rows.map(card).join('');
      }

      function load() {
        Ui.clearAlert(alertBox);
        return Api.get('/api/donations/mine').then(function (r) {
          all = Array.isArray(r) ? r : ((r && r.content) || []);
          all.sort(function (a, b) { return b.id - a.id; });
          render();
        }).catch(function (e) {
          listEl.innerHTML = '';
          Ui.showAlert(alertBox, e.message);
        });
      }

      function matchesHtml(list) {
        if (list && list.content) { list = list.content; }
        if (!list || !list.length) { return '<div class="small text-secondary">No NGO offers for this donation.</div>'; }
        return '<ul class="list-group list-group-flush">' + list.map(function (m, i) {
          var name = m.ngoName || m.organizationName || ('NGO #' + m.ngoId);
          var bits = [];
          var sc = m.matchScore != null ? m.matchScore : m.score;
          if (sc != null) { bits.push('score ' + Number(sc).toFixed(0)); }
          if (m.distanceKm != null) { bits.push(Number(m.distanceKm).toFixed(1) + ' km'); }
          if (m.status) { bits.push(label(m.status)); }
          return '<li class="list-group-item px-0 d-flex justify-content-between gap-2"><span><span class="badge text-bg-success me-2">' + (i + 1) + '</span>' + esc(name) + '</span><span class="small text-secondary">' + esc(bits.join(' · ')) + '</span></li>';
        }).join('') + '</ul>';
      }

      listEl.addEventListener('click', async function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) { return; }
        var cardEl = btn.closest('[data-id]');
        var id = cardEl.dataset.id;
        var box = cardEl.querySelector('[data-box]');
        if (btn.dataset.act === 'matches') {
          if (!box.hidden) { box.hidden = true; return; }
          box.hidden = false;
          box.innerHTML = '<span class="fl-skeleton" style="height:1.2rem"></span>';
          try { box.innerHTML = matchesHtml(await Api.get('/api/donations/' + id + '/matches')); }
          catch (err) { box.innerHTML = '<div class="small text-danger">' + esc(err.message) + '</div>'; }
        } else if (btn.dataset.act === 'cancel') {
          var ok = await Ui.confirm({ title: 'Cancel this donation?', message: 'NGOs that were offered this donation will no longer see it.', confirmText: 'Cancel donation', cancelText: 'Keep it', variant: 'danger' });
          if (!ok) { return; }
          Ui.setBusy(btn, true, 'Cancelling…');
          try { await Api.post('/api/donations/' + id + '/cancel'); Ui.toast('Donation cancelled.'); await load(); }
          catch (err) { Ui.setBusy(btn, false); Ui.toast(err.message, 'danger'); }
        }
      });

      document.getElementById('filter').addEventListener('change', render);
      load();
    })();
  </script>
</body>
</html>
