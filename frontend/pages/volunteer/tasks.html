<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['VOLUNTEER']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Tasks</h1>
        <p class="text-secondary mb-0">Pick up nearby donations and deliver them to the NGO.</p>
      </div>
      <button id="refresh" type="button" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Refresh</button>
    </div>

    <div id="alert" class="alert alert-danger" role="alert" aria-live="assertive" hidden></div>

    <h2 class="h6 text-uppercase text-secondary">My active deliveries</h2>
    <div id="mine" class="d-grid gap-3 mb-4"><div class="fl-card p-4"><span class="fl-skeleton" style="height:3rem"></span></div></div>

    <h2 class="h6 text-uppercase text-secondary">Available near you</h2>
    <div id="avail" class="d-grid gap-3 mb-4"><div class="fl-card p-4"><span class="fl-skeleton" style="height:3rem"></span></div></div>

    <details id="past-wrap" hidden>
      <summary class="h6 text-uppercase text-secondary" style="cursor:pointer">Past tasks (<span id="past-count">0</span>)</summary>
      <div id="past" class="d-grid gap-3 mt-3"></div>
    </details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      if (!FoodLoopAuth.getUser()) { return; }
      FoodLoopLayout.mount({ active: 'tasks' });

      var alertBox = document.getElementById('alert');
      var NEXT = {
        NOT_STARTED: ['PICKED_UP', 'Mark picked up', 'bi-box-arrow-up'],
        PICKED_UP: ['IN_TRANSIT', 'Start delivery', 'bi-truck'],
        IN_TRANSIT: ['DELIVERED', 'Mark delivered', 'bi-check2-circle']
      };
      var DELIV = { NOT_STARTED: 'secondary', PICKED_UP: 'warning', IN_TRANSIT: 'warning', DELIVERED: 'success', RECEIPT_CONFIRMED: 'success', FAILED: 'danger' };
      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }

      function card(p, mode) {
        var ds = p.deliveryStatus || (p.deliveryId ? 'NOT_STARTED' : null);
        var next = mode === 'mine' && p.deliveryId ? NEXT[ds] : null;
        return '<div class="fl-card p-3" data-pickup="' + esc(p.id) + '" data-delivery="' + esc(p.deliveryId || '') + '">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2">' +
            '<div><div class="fw-semibold">' + esc(p.category || 'Food') + ' · ' + esc(p.quantityKg) + ' kg <span class="text-secondary fw-normal small">donation #' + esc(p.donationId) + '</span></div>' +
            '<div class="small text-secondary">For ' + esc(p.ngoName || ('NGO #' + p.ngoId)) + (p.distanceKm != null ? ' · ' + Number(p.distanceKm).toFixed(1) + ' km away' : '') + '</div></div>' +
            '<div class="d-flex gap-1 flex-wrap justify-content-end"><span class="badge text-bg-secondary">' + esc(label(p.status)) + '</span>' +
            (ds ? '<span class="badge text-bg-' + (DELIV[ds] || 'secondary') + '">' + esc(label(ds)) + '</span>' : '') + '</div></div>' +
          '<dl class="row small mt-3 mb-0">' +
            '<dt class="col-sm-3 text-secondary fw-normal">Pickup at</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(p.scheduledPickupAt)) + '</dd>' +
            '<dt class="col-sm-3 text-secondary fw-normal">Window</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(p.pickupWindowStart)) + ' – ' + esc(Ui.formatDateTime(p.pickupWindowEnd)) + '</dd>' +
            '<dt class="col-sm-3 text-secondary fw-normal">Best before</dt><dd class="col-sm-9">' + esc(Ui.formatDateTime(p.expiresAt)) + '</dd>' +
          '</dl>' +
          (mode === 'avail' ? '<button type="button" class="btn btn-primary btn-sm mt-2" data-act="accept"><i class="bi bi-hand-thumbs-up me-1" aria-hidden="true"></i>Accept task</button>' : '') +
          (next ? '<button type="button" class="btn btn-primary btn-sm mt-2" data-act="status" data-status="' + next[0] + '"><i class="bi ' + next[2] + ' me-1" aria-hidden="true"></i>' + next[1] + '</button>' : '') +
          '</div>';
      }
      function empty(icon, text) { return '<div class="fl-card"><div class="fl-empty"><i class="bi ' + icon + '" aria-hidden="true"></i>' + text + '</div></div>'; }
      function arr(r) { return Array.isArray(r) ? r : ((r && r.content) || []); }

      function load() {
        Ui.clearAlert(alertBox);
        return Promise.all([Api.get('/api/volunteer/tasks/assigned'), Api.get('/api/volunteer/tasks/available')]).then(function (res) {
          var assigned = arr(res[0]).sort(function (a, b) { return b.id - a.id; });
          var avail = arr(res[1]);
          var done = { DELIVERED: 1, RECEIPT_CONFIRMED: 1, FAILED: 1 };
          var active = assigned.filter(function (p) { return p.status !== 'CANCELLED' && !done[p.deliveryStatus]; });
          var past = assigned.filter(function (p) { return active.indexOf(p) === -1; });
          document.getElementById('mine').innerHTML = active.length ? active.map(function (p) { return card(p, 'mine'); }).join('') : empty('bi-bicycle', 'No active deliveries. Accept a task below.');
          document.getElementById('avail').innerHTML = avail.length ? avail.map(function (p) { return card(p, 'avail'); }).join('') : empty('bi-geo-alt', 'No tasks near you right now. Check your availability and service radius.');
          document.getElementById('past-wrap').hidden = !past.length;
          document.getElementById('past-count').textContent = past.length;
          document.getElementById('past').innerHTML = past.map(function (p) { return card(p, 'past'); }).join('');
        }).catch(function (err) {
          ['mine', 'avail'].forEach(function (id) { document.getElementById(id).innerHTML = ''; });
          Ui.showAlert(alertBox, err.message);
        });
      }

      document.getElementById('content').addEventListener('click', async function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) { return; }
        var box = btn.closest('[data-pickup]');
        Ui.setBusy(btn, true, 'Please wait…');
        try {
          if (btn.dataset.act === 'accept') {
            await Api.post('/api/volunteer/pickups/' + box.dataset.pickup + '/accept', {});
            Ui.toast('Task accepted. It is in your active deliveries.');
          } else {
            await Api.patch('/api/volunteer/deliveries/' + box.dataset.delivery + '/status', { status: btn.dataset.status });
            Ui.toast('Status updated.');
          }
          await load();
        } catch (err) { Ui.toast(err.message, 'danger'); await load(); }
      });
      document.getElementById('refresh').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
