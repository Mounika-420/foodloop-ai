<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['VOLUNTEER']);</script>
</head>
<body>  <main id="content" class="fl-main" tabindex="-1">
    <h1 class="h3 mb-1">History</h1>
    <p class="text-secondary">Every delivery you were part of.</p>
    <div id="alert" class="alert alert-danger" role="alert" hidden></div>

    <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
      <div><label for="status" class="form-label small mb-1">Status</label>
        <select id="status" class="form-select form-select-sm">
          <option value="">All</option><option value="NOT_STARTED">Not started</option><option value="PICKED_UP">Picked up</option>
          <option value="IN_TRANSIT">In transit</option><option value="DELIVERED">Delivered</option>
          <option value="RECEIPT_CONFIRMED">Receipt confirmed</option><option value="FAILED">Failed</option>
        </select></div>
      <span id="count" class="small text-secondary ms-auto" role="status"></span>
    </div>

    <div class="fl-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Donation</th><th>Quantity</th><th>Status</th><th class="d-none d-md-table-cell">Picked up</th><th class="d-none d-md-table-cell">Delivered</th><th class="d-none d-lg-table-cell">Confirmed</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6"><span class="fl-skeleton" style="height:2rem"></span></td></tr></tbody>
        </table>
      </div>
    </div>
    <div id="pager" class="d-flex justify-content-between align-items-center mt-3" hidden>
      <button id="prev" type="button" class="btn btn-outline-secondary btn-sm">&lsaquo; Prev</button>
      <span id="pageinfo" class="small text-secondary"></span>
      <button id="next" type="button" class="btn btn-outline-secondary btn-sm">Next &rsaquo;</button>
    </div>
  </main>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      var user = FoodLoopAuth.getUser();
      if (!user) { return; }
      FoodLoopLayout.mount({ active: 'history' });
      var path = user.role === 'NGO' ? '/api/ngo/history' : '/api/volunteer/history';
      var page = 0, totalPages = 1, total = 0, rows = [];
      var SB = { NOT_STARTED: 'secondary', PICKED_UP: 'warning', IN_TRANSIT: 'warning', DELIVERED: 'success', RECEIPT_CONFIRMED: 'success', FAILED: 'danger' };
      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }
      function dt(v) { return v ? Ui.formatDateTime(v) : '–'; }
      function row(h) {
        var qty = esc(h.quantityKg) + ' kg' + (h.quantityReceivedKg != null ? '<div class="small text-secondary">received ' + esc(h.quantityReceivedKg) + ' kg</div>' : '');
        var st = '<span class="badge text-bg-' + (SB[h.status] || 'secondary') + '">' + esc(label(h.status)) + '</span>' + (h.failureReason ? '<div class="small text-danger">' + esc(h.failureReason) + '</div>' : '');
        return '<tr><td><div class="fw-semibold">#' + esc(h.donationId) + '</div><div class="small text-secondary">' + esc(h.category || '') + '</div></td>' +
          '<td>' + qty + '</td><td>' + st + '</td>' +
          '<td class="d-none d-md-table-cell small">' + esc(dt(h.pickedUpAt)) + '</td>' +
          '<td class="d-none d-md-table-cell small">' + esc(dt(h.deliveredAt)) + '</td>' +
          '<td class="d-none d-lg-table-cell small">' + esc(dt(h.receiptConfirmedAt)) + '</td></tr>';
      }
      function render() {
        document.getElementById('count').textContent = total + ' deliver' + (total === 1 ? 'y' : 'ies');
        document.getElementById('rows').innerHTML = rows.length ? rows.map(row).join('') : '<tr><td colspan="6"><div class="fl-empty"><i class="bi bi-clock-history" aria-hidden="true"></i>No deliveries yet.</div></td></tr>';
        document.getElementById('pager').hidden = totalPages <= 1;
        document.getElementById('pageinfo').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
        document.getElementById('prev').disabled = page <= 0;
        document.getElementById('next').disabled = page >= totalPages - 1;
      }
      function load() {
        Ui.clearAlert(document.getElementById('alert'));
        return Api.get(path, { query: { status: document.getElementById('status').value, page: page, size: 20 } }).then(function (r) {
          rows = (r && r.content) || []; totalPages = (r && r.totalPages) || 1; total = r && r.totalElements != null ? r.totalElements : rows.length; render();
        }).catch(function (e) { document.getElementById('rows').innerHTML = ''; Ui.showAlert(document.getElementById('alert'), e.message); });
      }
      document.getElementById('status').addEventListener('change', function () { page = 0; load(); });
      document.getElementById('prev').addEventListener('click', function () { if (page > 0) { page--; load(); } });
      document.getElementById('next').addEventListener('click', function () { if (page < totalPages - 1) { page++; load(); } });
      load();
    })();
  </script>
</body>
</html>
