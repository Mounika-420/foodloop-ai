<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer dashboard · FoodLoop AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../css/theme.css" rel="stylesheet">
  <link href="../../css/components.css" rel="stylesheet">
  <link href="../../css/dashboard.css" rel="stylesheet">
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/guard.js"></script>
  <script>FoodLoopGuard.require(['VOLUNTEER']);</script>
</head>
<body>
  <main id="content" class="fl-main" tabindex="-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Welcome, <span id="who"></span></h1>
        <p class="text-secondary mb-0">Tasks near you and your deliveries.</p>
      </div>
      <div class="d-flex gap-2"><a class="btn btn-primary btn-sm" href="tasks.html"><i class="bi bi-geo-alt me-1" aria-hidden="true"></i>Open tasks</a></div>
    </div>
    <div id="alert" class="alert alert-danger" role="alert" hidden></div>
    <div class="row g-3 mb-3"><div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Tasks near you</div><div class="fl-stat-value" id="s1">&ndash;</div><div class="small text-secondary" id="s1-hint">Ready to accept</div></div></div><div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Active deliveries</div><div class="fl-stat-value" id="s2">&ndash;</div><div class="small text-secondary" id="s2-hint">In your hands now</div></div></div><div class="col-6 col-xl-3"><div class="fl-card fl-stat"><div class="text-secondary small mb-1">Deliveries done</div><div class="fl-stat-value" id="s3">&ndash;</div><div class="small text-secondary" id="s3-hint"></div></div></div></div>
    <div class="fl-card p-3"><h2 class="h6 mb-2">Active deliveries</h2><ul id="recent" class="list-group list-group-flush"><li class="list-group-item px-0"><span class="fl-skeleton" style="height:1.2rem"></span></li></ul></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    (function () {
      var Ui = FoodLoopUi, Api = FoodLoopApi, esc = Ui.escapeHtml;
      var user = FoodLoopAuth.getUser();
      if (!user) { return; }
      FoodLoopLayout.mount({ active: 'dashboard' });
      var $ = function (id) { return document.getElementById(id); };
      $('who').textContent = user.fullName;
      var alertBox = $('alert');
      function arr(r) { return Array.isArray(r) ? r : ((r && r.content) || []); }
      function label(s) { return String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }
      function fail(e) { Ui.showAlert(alertBox, e.message); }
      function card(id, title, hint) {
        return '';
      }
      Promise.all([Api.get('/api/volunteer/tasks/assigned'), Api.get('/api/volunteer/tasks/available')]).then(function (res) {
        var mine = arr(res[0]), avail = arr(res[1]);
        var closed = { DELIVERED: 1, RECEIPT_CONFIRMED: 1, FAILED: 1 };
        var active = mine.filter(function (p) { return p.status !== 'CANCELLED' && !closed[p.deliveryStatus]; });
        var done = mine.filter(function (p) { return p.deliveryStatus === 'DELIVERED' || p.deliveryStatus === 'RECEIPT_CONFIRMED'; });
        var kg = done.reduce(function (a, p) { return a + Number(p.quantityKg || 0); }, 0);
        $('s1').textContent = avail.length; $('s2').textContent = active.length;
        $('s3').textContent = done.length; $('s3-hint').textContent = Ui.formatKg(kg) + ' delivered';
        $('recent').innerHTML = active.sort(function (a, b) { return b.id - a.id; }).slice(0, 5).map(function (p) {
          return '<li class="list-group-item px-0 d-flex justify-content-between gap-2"><span>Donation #' + p.donationId + ' <span class="text-secondary small">for ' + esc(p.ngoName || '') + ' · ' + esc(p.quantityKg) + ' kg</span></span><span class="badge text-bg-warning">' + esc(label(p.deliveryStatus || p.status)) + '</span></li>';
        }).join('') || '<li class="list-group-item px-0 text-secondary">No active deliveries. Accept a task to get started.</li>';
      }).catch(fail);
    })();
  </script>
</body>
</html>
